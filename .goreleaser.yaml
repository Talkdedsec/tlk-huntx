version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: huntx
    main: ./cmd/huntx
    binary: huntx
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/talkdedsec/tlk-huntx/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

release:
  draft: true
