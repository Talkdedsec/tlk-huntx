<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="'Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="radar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6394a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e6394a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="280" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="278" rx="17" fill="none" stroke="#232936"/>

  <!-- radar sweep accent, right -->
  <g transform="translate(730,140)">
    <circle r="120" fill="url(#radar)"/>
    <circle r="40" fill="none" stroke="#2a3140" stroke-width="1"/>
    <circle r="75" fill="none" stroke="#242b38" stroke-width="1"/>
    <circle r="110" fill="none" stroke="#1f2531" stroke-width="1"/>
    <line x1="0" y1="0" x2="104" y2="-56" stroke="#e6394a" stroke-width="2"/>
    <circle cx="70" cy="-38" r="4" fill="#e6394a"/>
    <circle cx="-46" cy="30" r="3" fill="#ff9f43"/>
    <circle cx="24" cy="60" r="3" fill="#ffd24a"/>
  </g>

  <!-- crosshair emblem -->
  <g transform="translate(120,140)">
    <circle r="58" fill="#141821" stroke="#3a4152" stroke-width="2"/>
    <circle r="58" fill="none" stroke="#e6394a" stroke-width="2" stroke-dasharray="6 10" opacity="0.7"/>
    <line x1="-74" y1="0" x2="-58" y2="0" stroke="#8b95a7" stroke-width="2"/>
    <line x1="58" y1="0" x2="74" y2="0" stroke="#8b95a7" stroke-width="2"/>
    <line x1="0" y1="-74" x2="0" y2="-58" stroke="#8b95a7" stroke-width="2"/>
    <line x1="0" y1="58" x2="0" y2="74" stroke="#8b95a7" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle" font-size="66" font-weight="800" fill="#cdd5df">K</text>
    <circle cx="30" cy="-26" r="6" fill="#e6394a"/>
  </g>

  <!-- wordmark -->
  <text x="210" y="150" font-size="96" font-weight="800" letter-spacing="-2">
    <tspan fill="#cdd5df">hunt</tspan><tspan fill="#e6394a">x</tspan>
  </text>

  <!-- tagline -->
  <text x="214" y="192" font-size="19" letter-spacing="3.5" fill="#8b95a7">AUTHORIZED ATTACK SURFACE RECON &amp; TRIAGE</text>
  <g font-size="17" font-family="ui-monospace,Consolas,monospace">
    <text x="214" y="224" fill="#aab4c0">recon</text>
    <text x="288" y="224" fill="#e6394a">→</text>
    <text x="312" y="224" fill="#aab4c0">scan</text>
    <text x="372" y="224" fill="#e6394a">→</text>
    <text x="396" y="224" fill="#aab4c0">verify</text>
    <text x="470" y="224" fill="#e6394a">→</text>
    <text x="494" y="224" fill="#aab4c0">report</text>
  </g>
</svg>
